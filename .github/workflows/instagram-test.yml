name: Instagram - Test API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Tester la connexion Instagram
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ["IG_TOKEN"]
          user_id = os.environ["IG_USER_ID"]

          if not token or not user_id:
              raise SystemExit("ERREUR : secrets GitHub manquants.")

          url = (
              f"https://graph.facebook.com/v24.0/{user_id}"
              "?fields=id,username"
          )

          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)

              print("================================")
              print("CONNEXION INSTAGRAM REUSSIE")
              print("Compte :", data.get("username"))
              print("ID :", data.get("id"))
              print("================================")

          except urllib.error.HTTPError as e:
              data = json.loads(e.read())
              error = data.get("error", {})
              print("ERREUR API META")
              print("Code :", error.get("code"))
              print("Sous-code :", error.get("error_subcode"))
              raise SystemExit(1)
          PY
