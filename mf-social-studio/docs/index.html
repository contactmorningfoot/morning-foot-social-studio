<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Foot Social Studio</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0ff;background:#07142b}*{box-sizing:border-box}body{margin:0}header{background:#061a46;border-bottom:3px solid #ffd200;padding:23px max(20px,calc((100vw - 1300px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;margin:0}h1 span{color:#ffd200}main{max-width:1300px;margin:auto;padding:30px 20px}p{color:#adbbd7}#posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:24px}.card{background:#102342;border:1px solid #27416a;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.inside{padding:16px}.inside h2{font-size:17px;line-height:1.4;min-height:48px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#ffd200}button,a.btn{border:0;background:#ffd200;color:#061a46;border-radius:8px;padding:11px 13px;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px;display:inline-block;margin:5px 4px 0 0}button.secondary,a.secondary{background:#243e65;color:#fff}textarea{width:100%;min-height:125px;background:#091b36;color:white;border:1px solid #36547b;border-radius:8px;padding:12px;resize:vertical}#status{margin-bottom:25px}.hint{font-size:13px}select{background:#152a4b;color:white;border:1px solid #446187;padding:10px;border-radius:8px}@media(max-width:620px){header{flex-direction:column;align-items:start}}
</style></head><body><header><h1><span>MF.</span> SOCIAL STUDIO</h1><span>Instagram · Brouillons automatiques</span></header><main><h2>Publications prêtes à adapter</h2><p>Chaque article RSS devient un brouillon avec une carte 1080 × 1350 et une question pour engager la discussion. Vérifie les faits et les droits photo avant publication.</p><div id="status">Chargement des articles…</div><label>Filtrer : <select id="filter"><option value="all">Tous les formats</option><option value="stats">Statistiques</option><option value="mercato">Mercato</option><option value="match">Matchs</option><option value="debat">Débats</option></select></label><div id="posts" style="margin-top:22px"></div></main><script>
const list=document.querySelector('#posts'),status=document.querySelector('#status'),filter=document.querySelector('#filter');let posts=[];
function el(tag,attrs={},txt=''){let e=document.createElement(tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;return e}
function render(){list.replaceChildren();let arr=posts.filter(p=>filter.value==='all'||p.category===filter.value);status.textContent=`${arr.length} brouillon(s) affiché(s) · ${posts.length} au total`;
for(let p of arr){let card=el('article',{class:'card'}),img=el('img',{src:p.image,alt:'Visuel de '+p.title,loading:'lazy'}),inside=el('div',{class:'inside'}),tag=el('div',{class:'tag'},p.category),title=el('h2',{},p.title),area=el('textarea',{'aria-label':'Légende modifiable'});area.value=p.caption;
let copy=el('button',{},'Copier la légende');copy.onclick=async()=>{try{await navigator.clipboard.writeText(area.value);copy.textContent='Copié ✓'}catch{area.select();document.execCommand('copy');copy.textContent='Copié ✓'}};
let dl=el('a',{class:'btn',href:p.image,download:'morning-foot-'+p.id+'.png'},'Télécharger PNG');let link=el('a',{class:'btn secondary',href:p.url,target:'_blank',rel:'noopener noreferrer'},'Lire l’article');inside.append(tag,title,area,copy,dl,link);card.append(img,inside);list.append(card)}}
filter.addEventListener('change',render);fetch('posts.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('Fichier posts.json indisponible');return r.json()}).then(data=>{posts=data;render()}).catch(e=>{status.textContent='Aucun brouillon disponible pour le moment : '+e.message});
</script></body></html>
