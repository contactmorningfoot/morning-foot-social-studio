<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Foot Social Studio V3</title><style>:root{font-family:Arial,sans-serif;color:#f4f7ff;background:#06142e}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,5vw);border-bottom:1px solid #314263}h1{margin:0 0 8px}p{color:#b9c9e5}main{max-width:1400px;margin:auto;padding:24px}select,button,textarea{font:inherit}select,button{padding:11px 15px;border:1px solid #445779;border-radius:8px;background:#14284c;color:white;cursor:pointer}button.primary{background:#ffd200;color:#071633;border:0;font-weight:700}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}.card{background:#102447;border:1px solid #344a70;border-radius:14px;overflow:hidden;padding-bottom:16px}.preview{aspect-ratio:4/5;background:#071a46;display:flex;flex-direction:column;position:relative;overflow:hidden}.preview img{width:100%;height:58%;object-fit:contain;background:#101d35}.preview .cover{padding:14px 17px;flex:1;display:flex;flex-direction:column;justify-content:center;background:#071a46}.tag{font-size:11px;font-weight:bold;background:#ffd200;color:#071633;padding:5px 8px;width:max-content}.preview h2{font-size:21px;line-height:1.12;text-transform:uppercase}.preview small{color:#ffd200}.content{padding:15px}.content h3{line-height:1.3}.meta{color:#ffd200;font-size:12px}textarea{width:100%;height:145px;background:#071733;color:white;border:1px solid #435579;border-radius:8px;padding:10px;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{padding:30px;border:1px dashed #63789e;border-radius:12px}</style></head><body><header><h1>MORNING <span style="color:#ffd200">FOOT</span> / SOCIAL STUDIO</h1><p>V3 — sélection automatique des meilleurs sujets, fiches DataScout et brouillons Instagram. Validation manuelle avant publication.</p></header><main><div class="toolbar"><select id="filter"><option value="selected">Sélection du studio</option><option value="all">Tous les articles</option><option value="STATS">Stats</option><option value="MERCATO">Mercato</option><option value="MATCH">Match</option></select><span id="count"></span></div><div id="grid" class="grid"></div></main><script>
let posts=[];const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wrap(ctx,s,max=24){let lines=[],line='';for(let word of s.split(/\s+/)){if((line+' '+word).length>max&&line){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);return lines.slice(0,7)}
function canvas(post,slide){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d');x.fillStyle='#061a46';x.fillRect(0,0,1080,1350);x.fillStyle='#ffd200';x.fillRect(0,0,1080,14);x.font='bold 42px Arial';x.fillText('MORNING FOOT',65,90);x.font='bold 28px Arial';x.fillText(post.category,65,160);return {c,x}}
async function exportPng(post,slide){let {c,x}=canvas(post,slide);if(slide===2&&post.image){let im=await load(post.image);let ratio=Math.min(960/im.width,1090/im.height);let w=im.width*ratio,h=im.height*ratio;x.drawImage(im,(1080-w)/2,180+(1090-h)/2,w,h);x.font='24px Arial';x.fillStyle='#ffffff';x.fillText('Source : Morning-Foot.com / DataScout (si applicable)',65,1310)}else{if(post.image){let im=await load(post.image);let k=Math.min(970/im.width,850/im.height);let w=im.width*k,h=im.height*k;x.drawImage(im,(1080-w)/2,130+(850-h)/2,w,h)}x.fillStyle='#061a46';x.fillRect(0,990,1080,360);x.fillStyle='#fff';x.font='bold 43px Arial';let lines=wrap(x,post.title.toUpperCase(),38).slice(0,4);lines.forEach((s,i)=>x.fillText(s,60,1055+i*52));x.fillStyle='#ffd200';x.font='bold 25px Arial';x.fillText(post.question.toUpperCase().slice(0,65),60,1300)}let a=document.createElement('a');a.download=`morning-foot-${post.id}-slide-${slide}.png`;a.href=c.toDataURL('image/png');a.click()}
function load(src){return new Promise((ok,fail)=>{let im=new Image();im.onload=()=>ok(im);im.onerror=fail;im.src=src})}
function render(){let f=$('filter').value;let data=posts.filter(p=>f==='all'||f==='selected'&&p.selected||p.category===f).sort((a,b)=>b.score-a.score);$('count').textContent=data.length+' brouillon(s)';$('grid').innerHTML=data.length?data.map(p=>`<article class="card"><div class="preview">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<div class="cover"><span class="tag">${esc(p.category)}</span><h2>${esc(p.title)}</h2><small>${esc(p.question)}</small></div></div><div class="content"><div class="meta">${esc(p.date)} · Score ${p.score}/100 ${p.report?'· DATASCOUT':''} ${p.selected?'· SÉLECTIONNÉ':''}</div><h3>${esc(p.title)}</h3><p>${esc((p.reasons||[]).join(' · '))}</p><textarea id="caption-${p.id}">${esc(p.caption)}</textarea><div class="buttons"><button class="primary" onclick="copyCaption('${p.id}')">Copier la légende</button><button onclick="exportById('${p.id}',1)">PNG couverture</button>${p.report&&p.image?`<button onclick="exportById('${p.id}',2)">PNG fiche</button>`:''}<button onclick="window.open('${esc(p.url)}','_blank')">Article</button></div></div></article>`).join(''):'<div class="empty">Aucun article dans cette sélection. Choisissez « Tous les articles ».</div>'}
function copyCaption(id){navigator.clipboard.writeText($('caption-'+id).value)}function exportById(id,n){exportPng(posts.find(p=>p.id===id),n).catch(e=>alert('Image indisponible : '+e.message))}
$('filter').onchange=render;fetch('posts.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('posts.json introuvable');return r.json()}).then(data=>{posts=data;render()}).catch(e=>{$('grid').innerHTML='<div class="empty">Impossible de charger les brouillons : '+esc(e.message)+'</div>'});
</script></body></html>
