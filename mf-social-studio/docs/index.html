
<script>
instagramTest = async function(post,button){

  if(instagramBusy)return;

  const id=String(post.id);

  savePost(id);

  const snapshot={...post};
  const caption=String(snapshot.caption||"").trim();

  if(!caption||caption.length>2200){
    alert("Vérifie la légende Instagram.");
    return;
  }

  instagramBusy=true;
  button.disabled=true;

  const status=$("ig-status-"+id);

  function show(message,type=""){
    if(status){
      status.className="ig-status "+type;
      status.textContent=message;
    }
  }

  try{

    show("Vérification du service...");

    const check=await fetch(IG_API+"/",{
      cache:"no-store"
    });

    const service=await check.json();

    if(!check.ok||
       service.mode!=="live"||
       service.storage!=="connected"){

      throw new Error(
        "Cloudflare n'est pas prêt pour la publication réelle."
      );
    }

    if(!confirm(
      "PUBLIER SUR INSTAGRAM ?\n\n"+
      snapshot.title+
      "\n\nCompte : @morningfoot.fr"+
      "\n\nAttention : publication réelle et publique."
    )){
      show("Publication annulée.");
      return;
    }

    if(!instagramSecret){

      instagramSecret=String(
        prompt("Saisis ton nouveau mot de passe Cloudflare :")||""
      ).trim();

      if(!instagramSecret){
        show("Publication annulée.");
        return;
      }
    }

    const photo=await loadFirst(
      photoCandidates(snapshot)
    );

    if(!photo){
      throw new Error("Photo indisponible.");
    }

    if(!(await loadLogo())){
      throw new Error("Logo indisponible.");
    }

    let report=null;

    if(snapshot.report){

      report=await loadFirst(
        reportCandidates(snapshot)
      );

      if(!report){
        throw new Error("Fiche DataScout indisponible.");
      }
    }

    const slides=report?[1,2,3]:[1,3];

    const payload={
      slide_1:"",
      slide_2:"",
      slide_3:"",
      caption:caption
    };

    for(let i=0;i<slides.length;i++){

      button.textContent=
        "Transfert "+(i+1)+"/"+slides.length;

      show(
        "Envoi du visuel "+
        (i+1)+"/"+slides.length
      );

      const blob=await instagramJPEG(
        snapshot,slides[i]
      );

      payload["slide_"+slides[i]]=
        await instagramUpload(blob);
    }

    button.textContent="Publication en cours...";

    show("Transmission à Instagram...");

    const result=await instagramRequest(
      "/publish",
      JSON.stringify(payload),
      "application/json"
    );

    if(result.mode!=="live"){
      throw new Error(
        "Le serveur est toujours en mode test."
      );
    }

    button.textContent="✓ Publication lancée";

    show(
      "Carrousel transmis. Publication en cours de traitement.",
      "success"
    );

    alert(
      "PUBLICATION LANCÉE\n\n"+
      slides.length+" visuels transmis.\n\n"+
      "Vérifie la publication sur Instagram avant de marquer cet article comme publié."
    );

  }catch(error){

    instagramSecret="";

    button.textContent="Publier sur Instagram";

    show("Erreur : "+error.message,"error");

    alert("Erreur Instagram : "+error.message);

  }finally{

    instagramBusy=false;
    button.disabled=false;
  }
};

function activateInstagramButton(){

  document.querySelectorAll(
    'button[data-action="instagram"]'
  ).forEach(button=>{

    if(button.textContent.trim()==="Tester Instagram"){

      button.textContent="Publier sur Instagram";
    }
  });

  document.querySelectorAll(".ig-status").forEach(status=>{

    if(status.textContent.trim()==="Instagram : mode test"){

      status.textContent="Instagram · Publication manuelle";
    }
  });

  const notice=document.querySelector(".notice");

  if(notice){

    notice.textContent=
      "Publication Instagram sur confirmation uniquement. "+
      "Vérifiez les informations, les légendes et les droits des photos.";
  }
}

const liveInstagramObserver=new MutationObserver(
  activateInstagramButton
);

liveInstagramObserver.observe(
  document.getElementById("grid"),
  {
    childList:true,
    subtree:true
  }
);

activateInstagramButton();
</script>
