
<style>
.ig-publish{
  background:linear-gradient(110deg,#833ab4,#c13584,#e1306c);
  border:0;
  color:#fff;
  font-weight:800;
  padding:12px 16px;
}
.ig-publish:disabled{
  opacity:.6;
  cursor:wait;
}
.ig-status{
  width:100%;
  font-size:12px;
  line-height:1.6;
  color:#93a4bb;
  margin-top:8px;
}
.ig-status.success{
  color:#83c9a2;
}
.ig-status.error{
  color:#ff8585;
}
</style>

<script>
"use strict";

const IG_API =
  "https://morning-foot-social-api.contact-morningfoot.workers.dev";

let igSecret = "";
let igBusy = false;

async function igRequest(path,body,type,secret){

  const response = await fetch(IG_API+path,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+secret,
      "Content-Type":type
    },
    body:body,
    credentials:"omit",
    cache:"no-store"
  });

  let result;

  try{
    result=await response.json();
  }catch(e){
    throw new Error("Réponse API invalide");
  }

  if(!response.ok || !result.success){
    throw new Error(
      (result.error || "Erreur API") +
      " ("+response.status+")"
    );
  }

  return result;
}

async function igMakeJPEG(post,n){

  const canvas=await makeSlide(post,n);

  const blob=await new Promise(resolve=>{
    canvas.toBlob(resolve,"image/jpeg",0.94);
  });

  if(!blob){
    throw new Error("Impossible de générer la slide "+n);
  }

  if(blob.size>8*1024*1024){
    throw new Error("Slide "+n+" trop volumineuse");
  }

  return blob;
}

async function igUpload(post,n,secret){

  const blob=await igMakeJPEG(post,n);

  const result=await igRequest(
    "/upload",
    blob,
    "image/jpeg",
    secret
  );

  if(!result.url){
    throw new Error("URL de la slide manquante");
  }

  return result.url;
}

async function igTestCarousel(post,button,status){

  if(igBusy)return;

  const id=String(post.id);

  savePost(id);

  const caption=String(
    $("caption-"+id)?.value || post.caption || ""
  ).trim();

  if(!caption){
    alert("La légende Instagram est vide.");
    return;
  }

  if(caption.length>2200){
    alert("La légende dépasse 2200 caractères.");
    return;
  }

  if(!confirm(
    "Préparer ce carrousel Instagram ?\n\n"+
    post.title+
    "\n\nMODE TEST : aucune publication réelle."
  )){
    return;
  }

  if(!igSecret){

    const secret=prompt(
      "Saisis ton API_SECRET Cloudflare :"
    );

    if(!secret)return;

    igSecret=secret.trim();
  }

  const secret=igSecret;

  igBusy=true;
  button.disabled=true;

  const originalLabel=button.textContent;

  function show(message,type=""){
    status.className="ig-status "+type;
    status.textContent=message;
  }

  try{

    const snapshot={...post};

    button.textContent="Préparation...";
    show("Vérification des visuels...");

    const photo=await loadFirst(
      photoCandidates(snapshot)
    );

    if(!photo){
      throw new Error("Photo de couverture indisponible");
    }

    if(!(await loadLogo())){
      throw new Error("Logo Morning Foot indisponible");
    }

    let hasReport=false;

    if(snapshot.report){
      const report=await loadFirst(
        reportCandidates(snapshot)
      );
      if(!report){
        throw new Error("Fiche DataScout indisponible");
      }
      hasReport=true;
    }

    const total=hasReport?3:2;

    show("Envoi de la couverture (1/"+total+")...");

    const slide1=await igUpload(
      snapshot,1,secret
    );

    let slide2="";

    if(hasReport){

      show("Envoi de la fiche DataScout (2/3)...");

      slide2=await igUpload(
        snapshot,2,secret
      );
    }

    show("Envoi du débat ("+total+"/"+total+")...");

    const slide3=await igUpload(
      snapshot,3,secret
    );

    show("Déclenchement du workflow Instagram...");

    const result=await igRequest(
      "/publish",
      JSON.stringify({
        slide_1:slide1,
        slide_2:slide2,
        slide_3:slide3,
        caption:caption
      }),
      "application/json",
      secret
    );

    show(
      "✓ "+total+" slides envoyées. "+
      "Workflow GitHub déclenché. "+
      "Aucune publication réelle.",
      "success"
    );

    button.textContent="✓ Test envoyé";

    alert(
      "Carrousel transmis avec succès !\n\n"+
      total+" slides envoyées.\n"+
      "Vérifie le résultat dans GitHub Actions.\n\n"+
      "MODE TEST : aucune publication réelle."
    );

  }catch(error){

    igSecret="";

    show(
      "Erreur : "+error.message,
      "error"
    );

    button.textContent=originalLabel;

    alert(
      "Erreur Instagram : "+error.message
    );

  }finally{

    igBusy=false;
    button.disabled=false;

  }
}

function igInstallButtons(){

  document.querySelectorAll(".card").forEach(card=>{

    const actions=card.querySelector(".actions");

    if(!actions)return;

    if(actions.querySelector(".ig-publish"))return;

    const title=card.querySelector(
      'input[id^="title-"]'
    );

    if(!title)return;

    const id=title.id.slice(6);

    const post=posts.find(
      p=>String(p.id)===id
    );

    if(!post)return;

    const button=document.createElement("button");

    button.type="button";
    button.className="ig-publish";
    button.textContent="Tester le carrousel Instagram";

    const status=document.createElement("div");

    status.className="ig-status";

    button.onclick=()=>{
      igTestCarousel(post,button,status);
    };

    actions.appendChild(button);
    actions.appendChild(status);

  });
}

const igOriginalRender=render;

render=function(){

  igOriginalRender();

  igInstallButtons();

};

document.getElementById("filter")
  .removeEventListener("change",igOriginalRender);

document.getElementById("filter")
  .addEventListener("change",render);

igInstallButtons();

</script>
